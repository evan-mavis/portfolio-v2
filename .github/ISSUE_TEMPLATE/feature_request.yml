name: Feature or content request
description: New section, page, project, or improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What should change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [home tree, travel, food, styling/theme, infra/tooling]
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      placeholder: "- The projects folder lists X with a working link"
